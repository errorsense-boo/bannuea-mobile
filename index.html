<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวนการผ่อนโทรศัพท์</title>
    <!-- Google Font: Roboto -->
    <link href="fonts.googleapis.com" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js (for reactive UI) -->
    <script defer src="cdn.jsdelivr.net"></script>
    <!-- SweetAlert2 -->
    <script src="cdn.jsdelivr.net"></script>
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body x-data="loanCalculator()">
    <div class="min-h-screen py-8 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden md:max-w-2xl">
            <div class="p-8">
                <!-- Header -->
                <div class="uppercase tracking-wide text-sm text-indigo-500 font-semibold mb-1">โปรแกรมคำนวณ</div>
                <h1 class="text-3xl font-bold text-gray-900 mb-6">คำนวนการผ่อนโทรศัพท์</h1>

                <!-- Inputs 1 -->
                <div class="grid grid-cols-1 gap-4 mb-8 sm:grid-cols-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ราคาเครื่อง (บาท)</label>
                        <input type="number" x-model.number="price" placeholder="ระบุราคาเครื่อง"
                            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">เงินดาวน์ (บาท)</label>
                        <input type="number" x-model.number="downPayment" placeholder="ระบุเงินดาวน์"
                            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                    </div>
                </div>

                <!-- Loan Options (Display when price & down are ready) -->
                <template x-if="price > 0 && price > downPayment">
                    <div class="space-y-3 mb-8">
                        <label class="block text-sm font-medium text-gray-500 uppercase tracking-widest">เลือกเงื่อนไขการผ่อน</label>
                        <template x-for="option in loanOptions" :key="option.months">
                            <button @click="selectOption(option)" 
                                :class="selectedOption && selectedOption.months === option.months ? 'ring-2 ring-indigo-600 border-indigo-600 bg-indigo-50' : 'border-gray-200 hover:border-indigo-300'"
                                class="w-full p-4 border rounded-xl flex justify-between items-center transition-all duration-200 text-left">
                                <div class="text-sm text-gray-600">
                                    <div class="font-bold text-gray-900 text-base" x-text="option.months + ' งวด (' + option.interestRate + '%)'"></div>
                                    <div class="text-xs italic" x-text="'สิ้นสุด: ' + getEndDate(option.months)"></div>
                                </div>
                                <div class="text-right">
                                    <span class="text-2xl font-black text-indigo-600" x-text="calculateInstallment(option.interestRate, option.months)"></span>
                                    <span class="text-gray-500 ml-1">บาท</span>
                                </div>
                            </button>
                        </template>
                    </div>
                </template>

                <!-- Customer Form (Show after selection) -->
                <template x-if="selectedOption">
                    <form @submit.prevent="submitData" class="space-y-4 border-t pt-8 animate-fade-in">
                        <h3 class="text-lg font-bold text-gray-800">ข้อมูลลูกค้า</h3>
                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                            <input type="text" x-model="form.fname" placeholder="ชื่อ" required class="p-3 border rounded-lg">
                            <input type="text" x-model="form.lname" placeholder="นามสกุล" required class="p-3 border rounded-lg">
                            <input type="tel" x-model="form.phone" placeholder="เบอร์โทรศัพท์" required class="p-3 border rounded-lg">
                            <input type="email" x-model="form.email" placeholder="อีเมล" class="p-3 border rounded-lg">
                        </div>
                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
                            <input type="text" x-model="form.address" placeholder="บ้านเลขที่" class="p-3 border rounded-lg">
                            <input type="text" x-model="form.moo" placeholder="หมู่" class="p-3 border rounded-lg">
                            <input type="text" x-model="form.subDistrict" placeholder="ตำบล" class="p-3 border rounded-lg">
                            <input type="text" x-model="form.district" placeholder="อำเภอ" class="p-3 border rounded-lg">
                            <input type="text" x-model="form.province" placeholder="จังหวัด" class="p-3 border rounded-lg">
                            <input type="text" x-model="form.zipcode" placeholder="รหัสไปรษณีย์" class="p-3 border rounded-lg">
                        </div>
                        <button type="submit" 
                            class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 shadow-lg transform transition active:scale-95">
                            บันทึกข้อมูลและยืนยันการผ่อน
                        </button>
                    </form>
                </template>
            </div>
        </div>
    </div>

    <script>
        function loanCalculator() {
            return {
                price: null,
                downPayment: null,
                selectedOption: null,
                loanOptions: [
                    { months: 2, interestRate: 10 },
                    { months: 3, interestRate: 15 },
                    { months: 4, interestRate: 15 },
                    { months: 5, interestRate: 15 },
                    { months: 6, interestRate: 15 }
                ],
                form: {
                    fname: '', lname: '', phone: '', email: '',
                    address: '', moo: '', subDistrict: '', district: '', province: '', zipcode: ''
                },
                
                calculateInstallment(rate, months) {
                    let principal = this.price - this.downPayment;
                    let totalInterest = principal * (rate / 100);
                    let totalAmount = principal + totalInterest;
                    let perMonth = totalAmount / months;
                    // ปัดเศษเป็นจำนวนเต็มสิบ
                    return Math.ceil(perMonth / 10) * 10;
                },

                getEndDate(months) {
                    const d = new Date();
                    d.setMonth(d.getMonth() + months);
                    return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
                },

                selectOption(opt) {
                    this.selectedOption = opt;
                },

                async submitData() {
                    Swal.fire({
                        title: 'กำลังบันทึกข้อมูล...',
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading(); }
                    });

                    const scriptURL = 'YOUR_GOOGLE_SCRIPT_WEB_APP_URL'; // ต้องสร้าง Google Apps Script ก่อน
                    
                    const payload = {
                        sheetId: "1FoDolaz-RZxMFxLpote23NnBjHryuJpI5Wh3xzVsx60",
                        sheetName: "Loan",
                        ...this.form,
                        price: this.price,
                        down: this.downPayment,
                        months: this.selectedOption.months,
                        monthlyPayment: this.calculateInstallment(this.selectedOption.interestRate, this.selectedOption.months)
                    };

                    try {
                        // จำลองการส่งข้อมูล (เนื่องจากต้องมีการติดตั้ง Apps Script ในฝั่ง Google)
                        // ในการใช้งานจริงให้เปลี่ยนจาก setTimeout เป็น fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) })
                        setTimeout(() => {
                            Swal.fire({
                                icon: 'success',
                                title: 'บันทึกสำเร็จ!',
                                text: 'ข้อมูลการผ่อนของคุณถูกบันทึกเรียบร้อยแล้ว',
                                confirmButtonColor: '#4f46e5'
                            });
                        }, 1500);
                    } catch (error) {
                        Swal.fire({
                            icon: 'error',
                            title: 'เกิดข้อผิดพลาด',
                            text: 'ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่อีกครั้ง'
                        });
                    }
                }
            }
        }
    </script>
</body>
</html>
